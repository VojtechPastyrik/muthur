apiVersion: v1
kind: Service
metadata:
  name: {{ include "muthur.fullname" . }}
  labels:
    {{- include "muthur.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # mTLS port — collectors talk to the gRPC Brain service here
    # (Ingest, SignCSR, BootstrapCert). The brain terminates TLS itself,
    # so in-cluster callers dial {service}:{port}. ServiceMonitor and
    # ingress templates honour the scheme switch.
    - port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      name: https
    # Plain-HTTP port — /feedback for browser clicks from notifications,
    # /metrics for Prometheus, /healthz for kubelet probes. Public-facing
    # ingress can terminate TLS here with a CA the browser already trusts.
    - port: {{ .Values.service.publicPort }}
      targetPort: http-public
      protocol: TCP
      name: http
  selector:
    {{- include "muthur.selectorLabels" . | nindent 4 }}
