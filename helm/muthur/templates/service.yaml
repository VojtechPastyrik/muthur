apiVersion: v1
kind: Service
metadata:
  name: {{ include "muthur.fullname" . }}
  labels:
    {{- include "muthur.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Port still named "http" by convention but the listener terminates TLS:
    # in-cluster callers must dial https://{service}:{port}. ServiceMonitor and
    # ingress templates handle the scheme switch.
    - port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      name: http
  selector:
    {{- include "muthur.selectorLabels" . | nindent 4 }}
