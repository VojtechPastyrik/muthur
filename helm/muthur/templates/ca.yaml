{{- /*
  Two-tier CA managed by cert-manager and provisioned on first install.

  Layout:
    selfSigned Issuer  ──signs──▶  Root Certificate (CA, 10y)
       │                                │
       │                                └─▶ Root Secret (kept; backup to safe)
       │
    Root Issuer  ──signs──▶  Intermediate Certificate (CA, 1y)
                                  │
                                  └─▶ Intermediate Secret (mounted into brain)
                                          │
                                          └─▶ ClusterIssuer "muthur-intermediate"
                                               (used by brain + in-cluster
                                                collectors for renewals)

  The root key is the apocalypse footgun: losing the Secret means rebuilding
  the entire PKI from scratch. Templates pin helm.sh/resource-policy=keep AND
  argocd Prune=false on the root Secret so neither helm uninstall nor an
  ArgoCD sync wipe can take it out.
*/}}
{{- if .Values.ca.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "muthur.fullname" . }}-ca-selfsigned
  labels:
    {{- include "muthur.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "muthur.fullname" . }}-root-ca
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
  labels:
    {{- include "muthur.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ .Values.ca.root.commonName | quote }}
  secretName: {{ .Values.ca.root.secretName }}
  secretTemplate:
    annotations:
      helm.sh/resource-policy: keep
      argocd.argoproj.io/sync-options: Prune=false
  duration: {{ .Values.ca.root.duration }}
  renewBefore: {{ .Values.ca.root.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 384
  issuerRef:
    name: {{ include "muthur.fullname" . }}-ca-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "muthur.fullname" . }}-root
  labels:
    {{- include "muthur.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ .Values.ca.root.secretName }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "muthur.fullname" . }}-intermediate-ca
  labels:
    {{- include "muthur.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ .Values.ca.intermediate.commonName | quote }}
  secretName: {{ .Values.ca.intermediate.secretName }}
  duration: {{ .Values.ca.intermediate.duration }}
  renewBefore: {{ .Values.ca.intermediate.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: {{ include "muthur.fullname" . }}-root
    kind: Issuer
---
{{- /*
  Namespaced Issuer used by the brain's own server cert. ClusterIssuer of
  type `ca:` would look for the Secret in cert-manager's namespace (default
  --cluster-resource-namespace), not in this release namespace where the
  intermediate Secret actually lives, so it cannot be used without extra
  cluster-wide reconfiguration. Stick with a namespaced Issuer so the
  install is self-contained.

  Out-of-cluster collectors do NOT need access to this Issuer: they
  exchange CSRs with the brain over the /bootstrap-cert and /sign-csr
  endpoints, which sign with the same intermediate key.
*/}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.ca.intermediate.issuerName }}
  labels:
    {{- include "muthur.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ .Values.ca.intermediate.secretName }}
{{- end }}
