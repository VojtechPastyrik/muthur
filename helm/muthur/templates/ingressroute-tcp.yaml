{{- /*
  Traefik IngressRouteTCP for end-to-end mTLS passthrough.

  Standard Ingress + `router.tls.passthrough` annotation does NOT work on
  Traefik v2/v3 — Traefik silently terminates with its default cert and
  forwards HTTP. Only IngressRouteTCP with HostSNI match and
  tls.passthrough: true actually streams raw TLS through to the backend.

  HostSNI is mandatory: passthrough hides the HTTP Host header, so SNI in
  the TLS ClientHello is the only L7 selector Traefik gets.
*/}}
{{- if .Values.ingressRouteTCP.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: {{ include "muthur.fullname" . }}-tcp
  labels:
    {{- include "muthur.labels" . | nindent 4 }}
  {{- with .Values.ingressRouteTCP.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- range .Values.ingressRouteTCP.entryPoints }}
    - {{ . }}
    {{- end }}
  routes:
    - match: HostSNI(`{{ .Values.ingressRouteTCP.host }}`)
      services:
        - name: {{ include "muthur.fullname" . }}
          port: {{ .Values.service.port }}
  tls:
    passthrough: true
{{- end }}
