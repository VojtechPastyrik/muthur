apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "muthur.fullname" . }}
  labels:
    {{- include "muthur.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "muthur.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "muthur.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # fsGroup makes kubelet chgrp mounted Secret/ConfigMap files so the
        # non-root user can read them. Without it, cert-manager-written
        # Secret files (root:root, mode 0400) cannot be opened by uid 65532
        # and the TLS listener crashes with "permission denied".
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "muthur.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: https
              containerPort: 8080
              protocol: TCP
            - name: http-public
              containerPort: 8081
              protocol: TCP
          # Probes go to the plain-HTTP listener so the kubelet (which has no
          # client cert) doesn't have to wrestle with the mTLS handshake.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-public
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http-public
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: PORT
              value: "8080"
            - name: PUBLIC_PORT
              value: "8081"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: ANTHROPIC_MODEL
              value: {{ .Values.config.anthropicModel | quote }}
            - name: LLM_TIMEOUT
              value: {{ .Values.config.llmTimeout | quote }}
            - name: LLM_MAX_CALLS_PER_MINUTE
              value: {{ .Values.config.llmMaxCallsPerMinute | quote }}
            - name: LLM_BURST
              value: {{ .Values.config.llmBurst | quote }}
            - name: LLM_MAX_CONCURRENT
              value: {{ .Values.config.llmMaxConcurrent | quote }}
            - name: LLM_PROVIDER
              value: {{ .Values.config.llm.provider | quote }}
            {{- if .Values.config.llm.model }}
            - name: LLM_MODEL
              value: {{ .Values.config.llm.model | quote }}
            {{- end }}
            {{- if .Values.config.llm.baseUrl }}
            - name: LLM_BASE_URL
              value: {{ .Values.config.llm.baseUrl | quote }}
            {{- end }}
            - name: LLM_SCHEMA_MODE
              value: {{ .Values.config.llm.schemaMode | quote }}
            - name: LLM_TEMPERATURE
              value: {{ .Values.config.llm.temperature | quote }}
            - name: LLM_MAX_RETRIES
              value: {{ .Values.config.llm.maxRetries | quote }}
            {{- if .Values.config.llm.apiKeySecretKey }}
            # API key is mounted as a FILE (never a plain env var). The Secret
            # key below is surfaced at /secrets/llm/api-key.
            - name: LLM_API_KEY_FILE
              value: /secrets/llm/api-key
            {{- end }}
            - name: DEDUP_WINDOW_MINUTES
              value: {{ .Values.config.dedupWindowMinutes | quote }}
            - name: ALERTMANAGER_URL
              value: {{ .Values.config.alertmanagerUrl | quote }}
            - name: ALERTMANAGER_SILENCE_ENABLED
              value: {{ .Values.config.alertmanagerSilenceEnabled | quote }}
            - name: ALERTMANAGER_SILENCE_DURATION
              value: {{ .Values.config.alertmanagerSilenceDuration | quote }}
            - name: ALERTMANAGER_SILENCE_ALLOWLIST
              value: {{ .Values.config.alertmanagerSilenceAllowlist | quote }}
            - name: MUTHUR_CONFIG_FILE
              value: /config/muthur.yaml
            - name: INCIDENT_HISTORY_ENABLED
              value: {{ .Values.config.incidentHistoryEnabled | quote }}
            - name: INCIDENT_TTL
              value: {{ .Values.config.incidentTtl | quote }}
            - name: NOTIFY_EVIDENCE_ENABLED
              value: {{ .Values.config.notifyEvidenceEnabled | quote }}
            - name: NOTIFY_LOG_LINES
              value: {{ .Values.config.notifyLogLines | quote }}
            - name: LLM_CACHE_ENABLED
              value: {{ .Values.config.llmCacheEnabled | quote }}
            - name: LLM_CACHE_TTL_MINUTES
              value: {{ .Values.config.llmCacheTtlMinutes | quote }}
            - name: SEMANTIC_CACHE_ENABLED
              value: {{ .Values.config.semanticCacheEnabled | quote }}
            - name: SEMANTIC_CACHE_THRESHOLD
              value: {{ .Values.config.semanticCacheThreshold | quote }}
            - name: SEMANTIC_CACHE_EMBED_DIM
              value: {{ .Values.config.semanticCacheEmbedDim | quote }}
            - name: CORRELATION_ENABLED
              value: {{ .Values.config.correlationEnabled | quote }}
            - name: CORRELATION_WINDOW_SECONDS
              value: {{ .Values.config.correlationWindowSeconds | quote }}
            - name: CORRELATION_MAX_GROUP
              value: {{ .Values.config.correlationMaxGroup | quote }}
            - name: FEEDBACK_FEW_SHOT
              value: {{ .Values.config.feedbackFewShot | quote }}
            {{- if .Values.config.publicUrl }}
            - name: MUTHUR_PUBLIC_URL
              value: {{ .Values.config.publicUrl | quote }}
            {{- end }}
            {{- if .Values.redis.url }}
            - name: REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: REDIS_PREFIX
              value: {{ .Values.redis.prefix | quote }}
            {{- end }}
            # --- mTLS ---
            # Server cert + key for the TLS listener (collectors verify brain).
            # Trust root for verifying client certs presented by collectors.
            # Intermediate keypair used to sign collector CSRs at /bootstrap-cert
            # and /sign-csr. All five files are mounted from cert-manager Secrets.
            - name: TLS_SERVER_CERT_FILE
              value: /secrets/tls/server/tls.crt
            - name: TLS_SERVER_KEY_FILE
              value: /secrets/tls/server/tls.key
            - name: TLS_TRUST_ROOT_FILE
              value: /secrets/tls/root/tls.crt
            - name: INTERMEDIATE_CA_FILE
              value: /secrets/tls/intermediate/tls.crt
            - name: INTERMEDIATE_KEY_FILE
              value: /secrets/tls/intermediate/tls.key
            - name: AUTH_REPLAY_WINDOW
              value: {{ .Values.config.authReplayWindow | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tls-server
              mountPath: /secrets/tls/server
              readOnly: true
            - name: tls-root
              mountPath: /secrets/tls/root
              readOnly: true
            - name: tls-intermediate
              mountPath: /secrets/tls/intermediate
              readOnly: true
            {{- if .Values.config.llm.apiKeySecretKey }}
            - name: llm-secret
              mountPath: /secrets/llm
              readOnly: true
            {{- end }}
            {{- if or .Values.externalSecrets.receiverSecretKeys .Values.devSecrets.receiverSecrets }}
            - name: receiver-secrets
              mountPath: /secrets/receivers
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "muthur.fullname" . }}-config
        - name: tls-server
          secret:
            secretName: {{ include "muthur.fullname" . }}-server-tls
            defaultMode: 0400
        - name: tls-root
          secret:
            # Mount the root Secret directly; only the public cert (tls.crt)
            # is read by the brain as the trust root. The root key MUST live
            # in this Secret too (cert-manager keeps it there) but the
            # process never reads it — file permissions and SecurityContext
            # keep it inaccessible to anything but the brain.
            secretName: {{ .Values.ca.root.secretName }}
            defaultMode: 0400
        - name: tls-intermediate
          secret:
            secretName: {{ .Values.ca.intermediate.secretName }}
            defaultMode: 0400
        {{- if .Values.config.llm.apiKeySecretKey }}
        - name: llm-secret
          secret:
            secretName: {{ include "muthur.fullname" . }}-secret
            items:
              - key: {{ .Values.config.llm.apiKeySecretKey }}
                path: api-key
        {{- end }}
        {{- if or .Values.externalSecrets.receiverSecretKeys .Values.devSecrets.receiverSecrets }}
        - name: receiver-secrets
          secret:
            secretName: {{ include "muthur.fullname" . }}-secret
            items:
              {{- range .Values.externalSecrets.receiverSecretKeys }}
              - key: {{ . }}
                path: {{ . }}
              {{- end }}
              {{- range $key, $value := .Values.devSecrets.receiverSecrets }}
              - key: {{ $key }}
                path: {{ $key }}
              {{- end }}
        {{- end }}
