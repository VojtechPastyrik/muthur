{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "muthur.fullname" . }}-secret
  labels:
    {{- include "muthur.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreName }}
    kind: {{ .Values.externalSecrets.secretStoreKind }}
  target:
    name: {{ include "muthur.fullname" . }}-secret
    creationPolicy: Owner
  data:
    {{- if .Values.config.llm.apiKeySecretKey }}
    # Generic LLM API key, mounted as a file (LLM_API_KEY_FILE). For the default
    # Anthropic provider this is the Anthropic key; for an OpenAI-compatible
    # provider put that provider's key in the same slot. Set apiKeySecretKey to
    # "" for keyless local endpoints (e.g. Ollama) to omit it entirely.
    - secretKey: {{ .Values.config.llm.apiKeySecretKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteSecretPath }}
        property: {{ .Values.externalSecrets.llmApiKeyProperty }}
    {{- end }}
    {{- range .Values.externalSecrets.collectorTokenKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecrets.remoteSecretPath }}
        property: {{ . }}
    {{- end }}
    {{- range .Values.externalSecrets.receiverSecretKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $.Values.externalSecrets.remoteSecretPath }}
        property: {{ . }}
    {{- end }}
{{- end }}
{{- if and .Values.devSecrets.enabled (not .Values.externalSecrets.enabled) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "muthur.fullname" . }}-secret
  labels:
    {{- include "muthur.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.config.llm.apiKeySecretKey }}
  {{ .Values.config.llm.apiKeySecretKey }}: {{ .Values.devSecrets.llmApiKey | default .Values.devSecrets.anthropicApiKey | quote }}
  {{- end }}
  {{- range .Values.devSecrets.collectorTokens }}
  collector-token-{{ .clusterId }}: {{ .token | quote }}
  {{- end }}
  {{- range $key, $value := .Values.devSecrets.receiverSecrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
