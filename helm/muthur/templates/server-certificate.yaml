{{- /*
  Brain's own server cert. Used by the TLS listener that terminates mTLS for
  the gRPC Brain service (Ingest, SignCSR — and BootstrapCert, which is
  exempt from client-cert auth but still needs a valid server cert so the
  collector can verify the brain).

  cert-manager renews this transparently; the brain reloads via the
  GetCertificate file-mtime callback without a restart.
*/}}
{{- if .Values.serverCert.enabled }}
{{- /*
  Pick the public hostname from whichever ingress flavor is enabled.
  Standard Ingress, Traefik IngressRouteTCP, and Gateway-API TLSRoute
  each carry the host in a different field; collapse them here so the
  server cert always contains the right SAN regardless of which flavor
  the operator picked.
*/}}
{{- $publicHost := "" }}
{{- if .Values.ingress.enabled }}{{ $publicHost = .Values.ingress.host }}
{{- else if .Values.ingressRouteTCP.enabled }}{{ $publicHost = .Values.ingressRouteTCP.host }}
{{- else if .Values.tlsRoute.enabled }}{{ $publicHost = .Values.tlsRoute.host }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "muthur.fullname" . }}-server
  labels:
    {{- include "muthur.labels" . | nindent 4 }}
spec:
  secretName: {{ include "muthur.fullname" . }}-server-tls
  duration: {{ .Values.serverCert.duration }}
  renewBefore: {{ .Values.serverCert.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
  commonName: {{ .Values.serverCert.commonName | default $publicHost | quote }}
  dnsNames:
    {{- if $publicHost }}
    - {{ $publicHost | quote }}
    {{- end }}
    {{- range .Values.serverCert.extraDnsNames }}
    - {{ . | quote }}
    {{- end }}
    # In-cluster DNS so an in-namespace collector can connect via the Service
    # without going through ingress.
    - {{ include "muthur.fullname" . }}
    - {{ printf "%s.%s.svc" (include "muthur.fullname" .) .Release.Namespace }}
    - {{ printf "%s.%s.svc.cluster.local" (include "muthur.fullname" .) .Release.Namespace }}
  issuerRef:
    name: {{ .Values.ca.intermediate.issuerName }}
    kind: Issuer
{{- end }}
