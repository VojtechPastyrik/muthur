replicaCount: 1

image:
  repository: ghcr.io/vojtechpastyrik/muthur
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  # mTLS port — collector traffic. Passthrough ingress points here.
  port: 8080
  # Plain-HTTP port — /feedback, /metrics, /healthz. Public ingress points
  # here and terminates TLS with a browser-trusted cert.
  publicPort: 8081

# Prometheus Operator ServiceMonitor for the /metrics endpoint. Enable when
# kube-prometheus-stack (or any Prometheus Operator) is present.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

ingress:
  enabled: true
  className: traefik
  host: muthur.yourdomain.com
  tls:
    enabled: true
    secretName: muthur-tls
    # When mTLS is in use the ingress MUST pass TLS through to the brain
    # rather than terminating it, because the client cert is verified by the
    # Go server, not the ingress. Traefik example:
    #   annotations:
    #     traefik.ingress.kubernetes.io/router.tls: "true"
    #     traefik.ingress.kubernetes.io/router.tls.passthrough: "true"
    passthrough: true
  annotations: {}


httpRoute:
  enabled: false
  host: muthur.yourdomain.com
  parentRefs:
    - name: web
      namespace: default
  annotations: {}

gateway:
  enabled: false
  className: traefik
  name: muthur
  namespace: ""
  listener:
    port: 443
    protocol: HTTPS
    allowedRoutesNamespacesFrom: Same
  tls:
    enabled: true
    secretName: muthur-tls

ingressRoute:
  enabled: false

# --- Traefik IngressRouteTCP (mTLS passthrough) ---
# Use this INSTEAD of `ingress` when you front the brain with Traefik v2/v3.
# Standard Ingress annotations don't actually passthrough TLS on those
# versions — only IngressRouteTCP with HostSNI does. The brain then sees the
# raw client cert and can perform mTLS itself.
ingressRouteTCP:
  enabled: false
  host: muthur-api.yourdomain.com
  entryPoints:
    - websecure
  annotations: {}

# --- Gateway API TLSRoute (mTLS passthrough via Gateway API) ---
# Use when fronted by Envoy Gateway / Cilium / any Gateway-API controller.
# Pair with a Gateway whose listener has tls.mode: Passthrough.
tlsRoute:
  enabled: false
  host: muthur-api.yourdomain.com
  parentRefs:
    - name: muthur-gateway
      namespace: envoy-gateway-system

# --- NGINX Ingress note ---
# NGINX-ingress passthrough uses the standard `ingress` block above plus
# the annotation `nginx.ingress.kubernetes.io/ssl-passthrough: "true"`.
# The controller must be started with `--enable-ssl-passthrough`. Add to
# ingress.annotations, no separate template needed.

# --- Public ingress ---
# Browser-facing hostname for /feedback (linked from notifications) and
# /metrics. Terminates TLS at the ingress with a browser-trusted cert
# (cert-manager / Let's Encrypt / Cloudflare). Hits the brain's plain-HTTP
# listener on service.publicPort.
publicIngress:
  enabled: false
  className: traefik
  host: muthur-feed.yourdomain.com
  tls:
    enabled: true
    secretName: muthur-feed-tls
  annotations: {}
  entryPoints:
    - websecure
  host: muthur.yourdomain.com
  tls:
    enabled: true
    secretName: muthur-tls
  annotations: {}

# --- Receivers ---
# Define named notification receivers. Multiple receivers of the same type are
# allowed — e.g. one Discord webhook for ops, another for dev.
#
# Each receiver has two sections:
#
#   config      — literal non-sensitive fields (chat_id, etc.)
#   secretKeys  — map of field name → Secret key; the chart mounts the Secret
#                 value as a file and the Go code reads it at runtime.
#
# Supported types and their fields:
#   telegram:  required { token, chat_id }
#   discord:   required { webhook_url }
#   slack:     required { webhook_url }
#   pagerduty: required { routing_key }, optional { url }
#   webhook:   required { url }
receivers: []
# Example:
# receivers:
#   - name: ops-telegram
#     type: telegram
#     config:
#       chat_id: "-100123456789"
#     secretKeys:
#       token: ops-telegram-token
#
#   - name: critical-discord
#     type: discord
#     secretKeys:
#       webhook_url: critical-discord-webhook
#
#   - name: dev-discord
#     type: discord
#     secretKeys:
#       webhook_url: dev-discord-webhook
#
#   - name: oncall-pd
#     type: pagerduty
#     secretKeys:
#       routing_key: oncall-pagerduty-key

# --- Routing ---
# First matching rule wins. Empty match fields match anything. The `receivers`
# field lists receiver names defined above.
routing:
  rules: []
# Example:
# routing:
#   rules:
#     - name: critical-prod
#       match:
#         severity: critical
#         cluster_id: cluster-prod
#       receivers: [ops-telegram, critical-discord, oncall-pd]
#     - name: warning-dev
#       match:
#         severity: warning
#         cluster_id: cluster-dev
#       receivers: [dev-discord]

config:
  anthropicModel: claude-opus-4-5

  # --- LLM provider ---
  # Anthropic (forced tool-use) is the default and best-supported backend: it
  # gives the most reliable structured output. An OpenAI-compatible endpoint
  # (OpenAI, Ollama, vLLM, LM Studio, OpenRouter, Groq, Together, ...) is also
  # supported via base_url + model — structured-output reliability there varies
  # by model. With these defaults behaviour is identical to before.
  llm:
    # "anthropic" or "openai-compatible".
    provider: anthropic
    # Model identifier. Empty selects the provider default (Anthropic uses
    # anthropicModel above). Required for openai-compatible.
    model: ""
    # Endpoint for openai-compatible (e.g. http://ollama.ai.svc:11434/v1).
    baseUrl: ""
    # "schema" (JSON Schema response_format), "json-object", or "auto"
    # (try schema, fall back to json-object if the endpoint rejects it).
    schemaMode: auto
    # 0 maximises structured-output determinism on small models.
    temperature: "0"
    # Corrective structured-output retries before degrading to raw delivery.
    maxRetries: 1
    # Secret key holding the LLM API key. Mounted as a FILE at
    # /secrets/llm/api-key (never a plain env var). Kept as ANTHROPIC_API_KEY so
    # existing Secret/ExternalSecret data is unchanged; the slot is provider-
    # neutral — for an OpenAI-compatible provider store that key in this same
    # slot. Set to "" for keyless local endpoints (e.g. Ollama).
    apiKeySecretKey: ANTHROPIC_API_KEY

  # --- Provider examples (copy into the llm block above) ---
  # (a) Default Anthropic (no changes needed):
  #   llm:
  #     provider: anthropic
  #     apiKeySecretKey: ANTHROPIC_API_KEY
  #
  # (b) Ollama, no API key (self-hosted, structured output best-effort):
  #   llm:
  #     provider: openai-compatible
  #     model: qwen2.5
  #     baseUrl: http://ollama.ai.svc:11434/v1
  #     schemaMode: auto
  #     apiKeySecretKey: ""        # keyless
  #
  # (c) OpenAI with a file-mounted key:
  #   llm:
  #     provider: openai-compatible
  #     model: gpt-4o-mini
  #     baseUrl: https://api.openai.com/v1
  #     schemaMode: schema
  #     apiKeySecretKey: ANTHROPIC_API_KEY   # reuse the slot; store the OpenAI key there
  #   externalSecrets:
  #     llmApiKeyProperty: openai-api-key    # vault property to read it from

  dedupWindowMinutes: 15
  # Per-call Claude timeout. Bounds how long a single (possibly hung) API call
  # can delay a page before muthur falls back to delivering the raw alert. The
  # LLM enriches — it must never block delivery.
  llmTimeout: 20s
  # --- Cost backstop ---
  # Hard ceilings on Claude calls, the last line of defence after cache/dedup/
  # correlation. Under a storm of distinct, uncacheable alerts the pipeline
  # degrades to raw delivery instead of an unbounded bill. Set
  # llmMaxCallsPerMinute or llmMaxConcurrent to 0 to disable.
  llmMaxCallsPerMinute: 60
  llmBurst: 15
  llmMaxConcurrent: 8
  # Grafana base URL is provided per-alert by the forwarding collector
  # (see muthur-collector config.grafanaBaseUrl) — there is no global fallback.
  alertmanagerUrl: http://alertmanager.monitoring.svc:9093
  alertmanagerSilenceEnabled: false
  alertmanagerSilenceDuration: 2h
  # Comma-separated alertnames that may be auto-silenced. Empty = no alertname
  # restriction. Critical-severity alerts are NEVER auto-silenced regardless of
  # this list — a hard guard against a prompt-injected log line muting a page.
  alertmanagerSilenceAllowlist: ""
  logLevel: info

  # --- Incident history ---
  # Persist each analysed incident under a stable ID (queryable in Grafana via
  # the "incident recorded" log; foundation for future read paths). Cheap, on.
  incidentHistoryEnabled: true
  incidentTtl: 720h
  # --- Evidence in notifications ---
  # Attach a tail of redacted log lines + key metric facts to each alert, so it
  # stays useful even when Claude is unavailable (the data is already in the
  # forwarded payload — this only surfaces it).
  notifyEvidenceEnabled: true
  notifyLogLines: 8

  # --- LLM analysis cache ---
  llmCacheEnabled: true
  llmCacheTtlMinutes: 30
  # Semantic cache reuses a prior analysis for a near-duplicate alert (same root
  # cause, different pod). Uses a local in-process embedder — no external calls.
  semanticCacheEnabled: false
  semanticCacheThreshold: "0.95" # minimum cosine similarity for a semantic hit
  semanticCacheEmbedDim: 256

  # --- Alert correlation ---
  # Groups alerts firing close together (same cluster+namespace, or same node)
  # into ONE incident: one Claude call, one notification. Cuts alert-storm noise.
  correlationEnabled: false
  correlationWindowSeconds: 30
  correlationMaxGroup: 25

  # --- Feedback loop ---
  # Number of recent operator verdicts replayed into the prompt as few-shot.
  feedbackFewShot: 3
  # Externally reachable base URL of muthur-central. Required for the thumbs-up /
  # thumbs-down feedback links in notifications to be emitted and clickable.
  publicUrl: ""

  # --- mTLS replay protection ---
  # Window (Go duration) within which incoming request timestamps are accepted.
  # Nonces are cached for 2× this. Tighter = stronger replay protection but
  # less tolerance for clock skew between collectors and brain.
  authReplayWindow: "5m"

# --- Persistence ---
# When url is set, dedup / analysis cache / feedback state is shared across
# replicas and survives restarts (Redis or DragonflyDB, redis:// or rediss://).
# Empty = in-memory store, per-replica, lost on restart.
redis:
  url: ""
  prefix: "muthur:"

# --- mTLS CA (cert-manager) ---
# Two-tier CA managed by the chart on the brain cluster: a self-signed root
# (10y) and an intermediate (1y, auto-renewed). The intermediate is what
# brain holds and what signs collector leafs at /bootstrap-cert and /sign-csr.
#
# IMPORTANT: when this chart is the source of the root, BACK UP the root
# Secret (default: muthur-root-ca-tls) to a safe place (1Password, USB in
# safe) right after first install. Losing it means rebuilding the entire
# PKI and re-onboarding every collector. The chart pins
# helm.sh/resource-policy=keep on the root resources so neither helm
# uninstall nor an ArgoCD prune can wipe it, but external admin deletion
# is still your responsibility.
ca:
  enabled: true
  root:
    commonName: MUTHUR Vendor Root CA
    duration: 87600h           # 10 years
    renewBefore: 720h          # 30 days
    secretName: muthur-root-ca-tls
  intermediate:
    commonName: MUTHUR Vendor Intermediate CA
    duration: 8760h            # 1 year
    renewBefore: 720h          # 30 days
    secretName: muthur-intermediate-ca-tls
    # ClusterIssuer name used by both brain and any in-cluster collector
    # whose chart references this issuer for its own cert.
    issuerName: muthur-intermediate

# --- Brain server cert ---
# cert-manager mints the listener's server cert from the intermediate. It's
# hot-reloaded by the brain on renewal (no restart needed).
serverCert:
  enabled: true
  duration: 720h               # 30 days
  renewBefore: 168h            # 7 days
  # Falls back to ingress.host when empty.
  commonName: ""
  extraDnsNames: []

# --- Tenants ---
# Per-cluster bootstrap config. Each entry must have:
#   - clusterId            unique cluster identifier (also the cert CN)
#   - tenantId             vendor customer group (SPIFFE URI tenant segment)
#   - bootstrapTokenHash   "sha256:<hex>" of the one-time bootstrap token
#                          (generated with `openssl rand -hex 32`, hashed with
#                           `echo -n "$TOKEN" | sha256sum`)
#   - bootstrapExpiresAt   RFC3339 timestamp after which bootstrap is rejected
#   - revoked              true to refuse all renewals (existing certs still
#                          work until natural expiry; pair with deny-list)
#   - certDuration         lifetime of issued leafs (default 720h / 30 days)
#
# Add or revoke clients by editing this list and merging the PR.
tenants: []
# Example:
# tenants:
#   - clusterId: cluster-acme
#     tenantId: acme
#     bootstrapTokenHash: "sha256:abc123..."
#     bootstrapExpiresAt: "2026-07-01T12:00:00Z"
#     revoked: false
#     certDuration: 720h

externalSecrets:
  enabled: true
  secretStoreName: vault-backend
  secretStoreKind: ClusterSecretStore
  remoteSecretPath: muthur/prod
  refreshInterval: 1h
  # Remote-store property that holds the LLM API key. Fetched into the Secret
  # key named by config.llm.apiKeySecretKey and mounted as a file. Default suits
  # the Anthropic key; override for an OpenAI-compatible provider.
  llmApiKeyProperty: anthropic-api-key
  # Secret keys to fetch from the remote secret store for receivers.
  # Each key must match a value referenced by receivers[*].secretKeys above.
  # Each key becomes a file mounted at /secrets/receivers/<key> in the pod.
  receiverSecretKeys: []
  # Example:
  # receiverSecretKeys:
  #   - ops-telegram-token
  #   - critical-discord-webhook

devSecrets:
  enabled: false
  # LLM API key for local dev, written into the Secret key named by
  # config.llm.apiKeySecretKey. llmApiKey takes precedence; anthropicApiKey is
  # kept as a backward-compatible alias. Leave both empty for keyless endpoints.
  llmApiKey: ""
  anthropicApiKey: ""
  # Receiver secrets for local dev — map of Secret key name → value.
  # Each key becomes a file mounted at /secrets/receivers/<key>.
  receiverSecrets: {}

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 64Mi
